<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy | Leve felicidade para o mundo</title>
    
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons & Leaflet CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Landing View -->
    <div id="landing-view" class="happy-landing">
        <div id="page-landing">
            <div class="content-wrapper">
                <img src="assets/logo.svg" alt="Happy">

                <main>
                    <h1>Leve felicidade para o mundo</h1>
                    <p>Visite orfanatos e mude o dia de muitas crianças.</p>
                </main>

                <div class="location">
                    <strong>Rio do Sul</strong>
                    <span>Santa Catarina</span>
                </div>

                <button class="enter-app" onclick="toggleView('map')" title="Ver no mapa" aria-label="Ver orfanatos no mapa">
                    <i class="bi bi-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Map View (App View) -->
    <div id="map-view" class="happy-map-page d-none">
        <!-- Sidebar -->
        <aside class="app-sidebar">
            <header>
                <img src="assets/marker.svg" alt="Happy Marker">
                <h2>Escolha um orfanato no mapa</h2>
                <p>Muitas crianças estão esperando a sua visita :)</p>
            </header>

            <footer>
                <strong>Rio do Sul</strong>
                <span>Santa Catarina</span>
                <button onclick="toggleView('landing')">
                    <i class="bi bi-arrow-left"></i>
                </button>
            </footer>
        </aside>

        <!-- Map Area -->
        <div id="map"></div>

        <!-- Add Orphanage Floating Button -->
        <button class="create-orphanage" title="Cadastrar orfanato" aria-label="Cadastrar orfanato">
            <i class="bi bi-plus"></i>
        </button>
    </div>

    <!-- Leaflet JS & Custom JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
