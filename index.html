<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy | Leve felicidade para o mundo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons & Leaflet CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Landing View -->
    <div id="landing-view" class="happy-landing">
        <div class="container-fluid h-100">
            <div class="row h-100 align-items-center position-relative px-lg-5">

                <!-- Content Left -->
                <div class="col-lg-5 d-flex flex-column justify-content-between h-75 z-2 py-4">
                    <!-- Brand -->
                    <div class="brand-header d-flex align-items-center gap-3">
                        <div class="logo-icon bg-warning rounded-4 d-flex align-items-center justify-content-center p-3 shadow-sm">
                            <i class="bi bi-emoji-smile-fill text-white fs-2"></i>
                        </div>
                        <h1 class="logo-text fw-extrabold m-0 display-5 text-white">happy</h1>
                    </div>

                    <!-- Main Text -->
                    <div class="landing-hero-text my-auto">
                        <h2 class="display-3 fw-bold text-white mb-4 leading-tight">Leve felicidade para o mundo</h2>
                        <p class="fs-4 text-white-50 mb-0 max-w-md">Visite orfanatos e mude o dia de muitas crianças.</p>
                    </div>

                    <!-- Location Footer -->
                    <div class="location-info text-white">
                        <strong class="d-block fs-5 fw-bold">Rio do Sul</strong>
                        <span class="text-white-50">Santa Catarina</span>
                    </div>
                </div>

                <!-- Content Right / Hero Illustration & Action -->
                <div class="col-lg-7 d-flex flex-column align-items-lg-end justify-content-between h-75 position-relative z-2">

                    <!-- Location Selector Desktop -->
                    <div class="location-badge text-end text-white d-none d-lg-block">
                        <strong class="d-block fs-5 fw-bold">Rio do Sul</strong>
                        <span class="text-white-50">Santa Catarina</span>
                    </div>

                    <!-- Hero Visual -->
                    <div class="hero-illustration my-auto w-100 text-center">
                        <div class="happy-cards-preview d-inline-flex gap-3 p-3 bg-white-10 rounded-4 backdrop-blur shadow-lg align-items-center">
                            <div class="bg-white rounded-3 p-3 text-start text-dark shadow-sm flex-grow-1">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <i class="bi bi-geo-alt-fill text-cyan"></i>
                                    <span class="fw-bold text-slate">Orfanato Esperança</span>
                                </div>
                                <small class="text-muted d-block">Atendimento das 8h às 18h</small>
                            </div>
                            <button class="btn btn-warning rounded-4 p-3 d-flex align-items-center justify-content-center shadow" onclick="toggleView('map')" title="Ver no mapa" aria-label="Ver orfanatos no mapa">
                                <i class="bi bi-arrow-right fs-3 text-dark"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <div class="action-wrapper">
                        <button onclick="toggleView('map')" class="enter-app-btn bg-warning text-dark border-0 rounded-4 d-flex align-items-center justify-content-center shadow-lg transition-all" title="Entrar no aplicativo" aria-label="Entrar no aplicativo">
                            <i class="bi bi-arrow-right fs-1"></i>
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Map View (App View) -->
    <div id="map-view" class="happy-map-page d-none">
        <!-- Sidebar -->
        <aside class="happy-sidebar d-flex flex-column justify-content-between p-4">
            <div>
                <div class="brand-header d-flex align-items-center gap-2 mb-4">
                    <div class="logo-icon bg-warning rounded-3 p-2 d-flex align-items-center justify-content-center">
                        <i class="bi bi-emoji-smile-fill text-white fs-4"></i>
                    </div>
                    <span class="logo-text fw-bold fs-3 text-white">happy</span>
                </div>
                <h2 class="fs-4 text-white fw-bold mb-3">Escolha um orfanato no mapa</h2>
                <p class="text-white-50 fs-6">Muitas crianças estão esperando a sua visita :)</p>
            </div>

            <div class="sidebar-footer">
                <div class="location text-white mb-4">
                    <strong class="d-block">Rio do Sul</strong>
                    <span class="text-white-50">Santa Catarina</span>
                </div>
                <button onclick="toggleView('landing')" class="btn btn-outline-light w-100 rounded-3 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-arrow-left"></i> Voltar para início
                </button>
            </div>
        </aside>

        <!-- Map Area -->
        <main class="happy-map-area position-relative flex-grow-1">
            <div id="map" class="h-100 w-100"></div>

            <!-- Add Orphanage Floating Button -->
            <button class="btn-create-orphanage btn btn-cyan text-white rounded-4 shadow-lg p-3 position-absolute bottom-0 end-0 m-4 z-3 d-flex align-items-center justify-content-center" title="Cadastrar orfanato" aria-label="Cadastrar orfanato">
                <i class="bi bi-plus-lg fs-2"></i>
            </button>
        </main>
    </div>

    <!-- Bootstrap & Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
